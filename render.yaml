services:
  - type: web
    name: cpyc-ais-relay
    runtime: node
    plan: free
    rootDir: ais-relay
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://jeffflaherty-droid.github.io
      - key: AISSTREAM_API_KEY
        sync: false
